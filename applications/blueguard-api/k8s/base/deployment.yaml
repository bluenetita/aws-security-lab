# v0.5.0-rc4 laboratory baseline. The image is intentionally still node-local.
# Do not apply the base by itself: the current API requires the Zeek snapshot mount.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blueguard-api
  namespace: blueguard
  labels:
    app.kubernetes.io/part-of: blueguard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: blueguard-api
  template:
    metadata:
      labels:
        app: blueguard-api
        app.kubernetes.io/part-of: blueguard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: localhost/blueguard-api:0.5.0-rc4
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BLUEGUARD_MODE
              value: demo
            - name: BLUEGUARD_ALERTS_FILE
              value: /app/demo/alerts.json
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 350m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
